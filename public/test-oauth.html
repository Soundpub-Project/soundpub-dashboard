<!DOCTYPE html>
<html>
<head>
    <title>Test Google OAuth</title>
</head>
<body>
    <h1>Test Google OAuth Configuration</h1>
    <button id="testBtn">Test Google Login</button>
    <div id="result"></div>
    
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        
        const supabase = createClient(
            'https://supabase.carubra.com',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgyMDU3ODE2LCJleHAiOjE5Mzk3Mzc4MTZ9.0tKWKzz1Y9Dr3H4fvae_KPv7dd6Io-5Tql46WPx0Y9U'
        );
        
        document.getElementById('testBtn').addEventListener('click', async () => {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const { data, error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin,
                    },
                });
                
                if (error) {
                    resultDiv.innerHTML = `<pre style="color: red;">Error: ${JSON.stringify(error, null, 2)}</pre>`;
                } else {
                    resultDiv.innerHTML = `<pre style="color: green;">Success! Redirecting...</pre>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<pre style="color: red;">Exception: ${err.message}</pre>`;
            }
        });
        
        // Check for OAuth callback
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            const errorDescription = urlParams.get('error_description');
            
            if (error) {
                document.getElementById('result').innerHTML = `
                    <h2 style="color: red;">OAuth Error Detected:</h2>
                    <pre style="color: red;">
Error: ${error}
Description: ${errorDescription}

Kemungkinan penyebab:
1. Client Secret salah di Supabase Dashboard
2. Redirect URI tidak terdaftar di Google Cloud Console
3. Pastikan: https://supabase.carubra.com/auth/v1/callback ada di Authorized redirect URIs
                    </pre>
                `;
            }
        });
    </script>
</body>
</html>
